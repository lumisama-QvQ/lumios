name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *"
  push:
    paths-ignore:
      - "**.md"

  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - recipes.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # base64 的 MOK.priv；未配置则跳过签名
      - name: Extract kernel signing key
        shell: bash
        env:
          KERNEL_SIGNING_SECRET: ${{ secrets.KERNEL_SIGNING_SECRET }}
        run: |
          if [[ -n "${KERNEL_SIGNING_SECRET}" ]]; then
            printf '%s' "${KERNEL_SIGNING_SECRET}" | base64 -d > MOK.priv
            echo "kernel signing enabled"
          else
            : > MOK.priv
            echo "WARNING: KERNEL_SIGNING_SECRET is not set; kernel/modules will be unsigned (Secure Boot must be disabled)"
          fi

      - name: Build Custom Image
        uses: blue-build/github-action@main
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          skip_checkout: true

          maximize_build_space: true
