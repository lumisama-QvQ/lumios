---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: lumios
description: 个人自用的 Fedora Silverblue (NVIDIA) 镜像。
base-image: ghcr.io/blue-build/base-images/fedora-silverblue-nvidia-open
image-version: 45
platforms:
- linux/amd64
modules:
- type: dnf
  remove:
    packages:
      - ibus-unikey
      - ibus-mozc
    auto-remove: false
- type: script
  scripts:
    - override-mutter.sh
- from-file: custom.yml
- type: signing
