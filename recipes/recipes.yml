---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: lumios
description: 个人自用的 Fedora Silverblue (NVIDIA) 镜像。
base-image: ghcr.io/blue-build/base-images/fedora-silverblue-nvidia-open
image-version: 45
platforms:
- linux/amd64
modules:
- type: dnf
  # base image 自带这两个 ibus 输入法；旧镜像没有，移除以保持行为一致
  remove:
    packages:
      - ibus-unikey
      - ibus-mozc
    auto-remove: false
- type: script
  # 重建 mutter 并反向应用 upstream d5e397c2（恢复不透明区域 blending），覆盖官方包
  scripts:
    - override-mutter.sh
- from-file: custom.yml
- type: signing
