---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: lumios
description: 个人自用的 Fedora Silverblue (NVIDIA) 镜像。
base-image: ghcr.io/blue-build/base-images/fedora-silverblue-nvidia-open
image-version: 45
platforms:
  - linux/amd64
modules:
  # L1 基线：几乎不变
  - type: kargs
    kargs:
      - rootflags=subvol=root,compress=zstd:1
  - type: dnf
    remove:
      packages:
        - ibus-unikey
        - ibus-mozc
      auto-remove: false
  - type: dnf
    group-remove:
      packages:
        - development-tools
    remove:
      packages:
        - nvtop
        - gnome-software
        - htop
      auto-remove: true
  - type: signing
  - type: files
    files:
      - source: system
        destination: /
  - type: systemd
    system:
      enabled:
        - lumios-fix-btrfs-compression.service
      # 不自动挂载网络磁盘（NFS/SMB）；NFS 本身保留，仍可手动挂载
      disabled:
        - remote-fs.target
        - NetworkManager-wait-online.service

  # L2 核心补丁：低频，构建慢
  - type: script
    scripts:
      - override-mutter.sh

  # L3 系统软件：跟随 Fedora
  - type: dnf
    install:
      packages:
        - libgda
        - libgda-sqlite
        - librime-lua
        - firefox-langpacks
        - ibus-rime

  # L4 CLI：低频，体积小
  - type: dnf
    install:
      packages:
        - micro
        - fish
        - smem
        - ps_mem

  # L5 字体：固定 URL，体积大
  - type: fonts
    fonts:
      nerd-fonts:
        - hack
        - FiraCode
      url-fonts:
        - name: Maple-Mono-NF-CN
          url: https://github.com/subframe7536/maple-font/releases/download/v7.9/MapleMono-NF-CN-unhinted.zip
        - name: lxgw-wenkai
          url: https://github.com/lxgw/LxgwWenKai/releases/download/v1.530/lxgw-wenkai-v1.530.tar.gz

  # L6 固定版本资源
  - type: script
    scripts:
      - bibata-cursors.sh
  - type: gschema-overrides
    include:
      - zz1-cursor.gschema.override

  # L7 低增量
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        install:
          - io.github.kolunmi.Bazaar
          - org.gtk.Gtk3theme.adw-gtk3
          - org.gtk.Gtk3theme.adw-gtk3-dark
          - it.mijorus.gearlever
          - org.gnome.Calendar
          - org.gnome.FileRoller
          - org.gnome.TextEditor
          - org.gnome.NautilusPreviewer
          - be.alexandervanhee.gradia
  - type: brew
    auto-upgrade: true
    brew-analytics: true

  # L8 桌面软件
  - type: dnf
    repos:
      cleanup: true
      copr:
        - oak443/clash-verge-rev
        - rivenirvana/morewaita-icon-theme
    install:
      packages:
        - gnome-tweaks
        - morewaita-icon-theme
        - clash-verge-rev

  # L9 在线最新
  - type: gnome-extensions
    install:
      - Blur my Shell
      - AppIndicator and KStatusNotifierItem Support
      - Caffeine
      - GNOME Fuzzy App Search
      - User Themes
      - Vitals
      - Dash to Dock
      - Legacy (GTK3) Theme Scheme Auto Switcher
      - IBus Tweaker
  - type: script
    scripts:
      - bazzar-companion
      - gradia-capture.sh
  - type: script
    scripts:
      - 1password.sh
