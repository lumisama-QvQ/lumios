# 个人化配置片段：由 recipes.yml 通过 `- from-file: custom.yml` 引入
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      cleanup: true
      copr:
        - scottames/ghostty
        - ublue-os/packages
        - ublue-os/staging
        - sneexy/zen-browser
    install:
      packages:
        # 补丁+依赖
        - libgda
        - libgda-sqlite
        - librime-lua
        - gnome-rounded-blur
        - nautilus-python
        # 补充
        - clash-meta
        - micro
        - topgrade
        - ibus-rime
        # GUI预装软件
        - ghostty
        - bazaar
        - gnome-tweaks
        - zen-browser
        - https://downloads.1password.com/linux/rpm/stable/x86_64/1password-latest.rpm
    group-remove:
      packages:
        - development-tools
    remove:
      packages:
        - nvtop
        - tmux
        - gnome-software
        - htop
      auto-remove: true

  - type: soar
    auto-upgrade: true
    upgrade-interval: 1d

  - type: default-flatpaks
    configurations:
      - notify: false # Send notification after install/uninstall is finished (true/false)
        scope: system
        install:
          - io.missioncenter.MissionCenter
          - com.github.tchx84.Flatseal
          - be.alexandervanhee.gradia
          - com.mattjakeman.ExtensionManager
          - io.github.realmazharhussain.GdmSettings
          - it.mijorus.gearlever
          - page.codeberg.libre_menu_editor.LibreMenuEditor
        # If no repo information is specified, Flathub will be used by default

  - type: fonts
    fonts:
      nerd-fonts:
        - hack
        - FiraCode
      url-fonts:
        - name: Maple-Mono-NF-CN
          url: https://github.com/subframe7536/maple-font/releases/download/v7.9/MapleMono-NF-CN-unhinted.zip
        - name: lxgw-wenkai
          url: https://github.com/lxgw/LxgwWenKai/releases/download/v1.530/lxgw-wenkai-v1.530.tar.gz

  - type: gnome-extensions
    install:
      - Blur my Shell
      - AppIndicator and KStatusNotifierItem Support
      - Caffeine
      - GNOME Fuzzy App Search
      - User Themes
      - Vitals
      - Dash to Dock

  - type: gschema-overrides
    include:
      - zz1-lumios-gnome-extensions.gschema.override # 默认启用上面安装的全部扩展 + bazaar 集成
      - zz1-lumios-extension-settings.gschema.override # Dash to Dock / Blur my Shell 的默认配置

  - type: script
    scripts:
      - bazzar-companion
      - bibata-cursors.sh # Bibata-Modern-Ice 光标主题
      - catppuccin-cursors.sh # Catppuccin mocha-mauve 光标主题
      - papirus-icons.sh # Papirus 图标主题 + papirus-mixed 混合主题
