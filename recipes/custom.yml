modules:
  - type: files
    files:
      - source: system
        destination: / # files/system/* → /

  - type: dnf
    repos:
      cleanup: true
      copr:
        - scottames/ghostty
        - oak443/clash-verge-rev
        - rivenirvana/morewaita-icon-theme
    install:
      packages:
        - libgda
        - libgda-sqlite
        - librime-lua
        - firefox-langpacks
        - micro
        - morewaita-icon-theme
        - fish
        - smem
        - ibus-rime
        - gnome-tweaks
        - clash-verge-rev
    group-remove:
      packages:
        - development-tools
        - gnome-shell-extension-*
    remove:
      packages:
        - nvtop
        - gnome-software
        - htop
      auto-remove: true

  - type: brew
    auto-upgrade: true
    brew-analytics: true

  - type: fonts
    fonts:
      nerd-fonts:
        - hack
        - FiraCode
      url-fonts:
        - name: Maple-Mono-NF-CN
          url: https://github.com/subframe7536/maple-font/releases/download/v7.9/MapleMono-NF-CN-unhinted.zip
        - name: lxgw-wenkai
          url: https://github.com/lxgw/LxgwWenKai/releases/download/v1.530/lxgw-wenkai-v1.530.tar.gz

  - type: gnome-extensions
    install:
      - Blur my Shell
      - AppIndicator and KStatusNotifierItem Support
      - Caffeine
      - GNOME Fuzzy App Search
      - User Themes
      - Vitals
      - Dash to Dock
      - Legacy (GTK3) Theme Scheme Auto Switcher
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        install:
          - io.github.kolunmi.Bazaar
          - it.mijorus.gearlever
          - org.gnome.Calendar
          - org.gnome.FileRoller
          - org.gnome.TextEditor
          - org.gnome.NautilusPreviewer

  - type: script
    scripts:
      - 1password.sh # 属组/GID 修正
      - gradia-capture.sh
      - bazzar-companion
      - bibata-cursors.sh
      - papirus-icons.sh
