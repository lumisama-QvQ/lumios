# 个人化配置片段：由 recipes.yml 通过 `- from-file: custom.yml` 引入
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      cleanup: true
      copr:
        - scottames/ghostty
        - oak443/clash-verge-rev
    install:
      packages:
        # 补丁+依赖
        - libgda
        - libgda-sqlite
        - librime-lua
        - firefox-langpacks
        # 补充
        - micro
        - fish
        - ibus-rime
        # GUI预装软件
        - gnome-tweaks
        - clash-verge-rev
    group-remove:
      packages:
        - development-tools
        - gnome-shell-extension-*
    remove:
      packages:
        - nvtop
        - gnome-software
        - htop
      auto-remove: true

  - type: brew
    auto-upgrade: true
    brew-analytics: true

  - type: fonts
    fonts:
      nerd-fonts:
        - hack
        - FiraCode
      url-fonts:
        - name: Maple-Mono-NF-CN
          url: https://github.com/subframe7536/maple-font/releases/download/v7.9/MapleMono-NF-CN-unhinted.zip
        - name: lxgw-wenkai
          url: https://github.com/lxgw/LxgwWenKai/releases/download/v1.530/lxgw-wenkai-v1.530.tar.gz

  - type: gnome-extensions
    install:
      - Blur my Shell
      - AppIndicator and KStatusNotifierItem Support
      - Caffeine
      - GNOME Fuzzy App Search
      - User Themes
      - Vitals
      - Dash to Dock
      - Legacy (GTK3) Theme Scheme Auto Switcher
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        install:
          - io.github.kolunmi.Bazaar
          - it.mijorus.gearlever
          - org.gnome.Calendar
          - org.gnome.FileRoller
          - org.gnome.TextEditor
          - org.gnome.NautilusPreviewer

  - type: script
    scripts:
      - 1password.sh # 安装 1Password 并修正 BrowserSupport/op/mcp 的属组与 setgid
      - gradia-capture.sh # 从 GitHub 源码安装 Gradia Capture 截图标注扩展
      - bazzar-companion
      - bibata-cursors.sh # Bibata-Modern-Ice 光标主题
      - papirus-icons.sh # Papirus 图标主题 + papirus-mixed 混合主题
